<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes — SICORP</title>
  <!-- Icono de la pestana del navegador (emblema de SEISA) -->
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/reportes.css">
  <script>document.documentElement.classList.add('js-anim');</script>
</head>

<body data-pagina="Reportes">

  <div class="app">

    <!-- ==================== BARRA LATERAL ==================== -->
    <aside class="sidebar">
      <div class="marca">
        <img src="img/logo.png" alt="SEISA">
        <span class="sistema">SICORP—SEISA</span>
      </div>

      <nav class="menu">
        <button class="menu-item" data-modulo="Empleados">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.5 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 12.8c-3 0-6 1.5-6 4.2V20h12v-3c0-2.7-3-4.2-6-4.2zm7.8.2c-.7 0-1.4.1-2 .3 1.3 1 2.2 2.3 2.2 3.9V20h4v-2.7c0-2.5-2.4-4.3-4.2-4.3z" />
          </svg>
          <span>Empleados</span>
        </button>
        <button class="menu-item" data-modulo="Inventario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round">
            <path
              d="M14.7 6.3a3.6 3.6 0 0 1-4.7 4.7L4.5 16.5a1.7 1.7 0 0 0 2.4 2.4L12.4 13a3.6 3.6 0 0 1 4.7-4.7l-2.4-2z" />
            <path d="M9.2 4.4L7.4 3l-2 .6-.6 2 1.4 1.8" />
            <path d="M19.6 14.8l1.8 1.8-.6 2-2 .6-1.8-1.4" />
          </svg>
          <span>Inventario</span>
        </button>
        <button class="menu-item" data-modulo="Nóminas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
            <rect x="4" y="3" width="13" height="18" rx="2" />
            <path d="M17 7h3v11a3 3 0 0 1-3 3" />
            <path d="M8 8h5M8 12h5M8 16h3" stroke-linecap="round" />
          </svg>
          <span>Nóminas</span>
        </button>
        <button class="menu-item" data-modulo="Reportes">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="13" width="4" height="8" rx="1" />
            <rect x="10" y="8" width="4" height="13" rx="1" />
            <rect x="17" y="3" width="4" height="18" rx="1" />
          </svg>
          <span>Reportes</span>
        </button>
        <button class="menu-item" data-modulo="Usuarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="9" cy="8.5" r="3.4" />
            <path d="M2.6 20c.8-3.4 3.4-5.3 6.4-5.3s5.6 1.9 6.4 5.3" />
            <path d="M16.3 5.4a3.3 3.3 0 0 1 0 6.4M17.8 15c2 .8 3.3 2.5 3.6 5" />
          </svg>
          <span>Usuarios</span>
        </button>
      </nav>

      <svg class="deco" viewBox="0 0 300 260" fill="none" aria-hidden="true">
        <path d="M0 40h60l26-26h120" stroke="#8C99A6" stroke-width="2.4" opacity=".55" />
        <path d="M0 78h74l26-26h150" stroke="#E3453F" stroke-width="2.4" />
        <path d="M0 118h84l26-26h140" stroke="#E3453F" stroke-width="2.4" opacity=".85" />
        <path d="M0 168h96l30 30h130" stroke="#2FA8DE" stroke-width="2.4" />
        <path d="M0 208h110l30 30h120" stroke="#2FA8DE" stroke-width="2.4" opacity=".75" />
        <path d="M0 240h124l26 26h110" stroke="#8C99A6" stroke-width="2.4" opacity=".45" />
        <circle cx="206" cy="14" r="5" fill="#E3453F" />
        <circle cx="250" cy="52" r="5" fill="#E3453F" />
        <circle cx="256" cy="198" r="5" fill="#2FA8DE" />
        <circle cx="260" cy="266" r="5" fill="#2FA8DE" />
      </svg>
    </aside>

    <!-- ==================== ZONA DERECHA ==================== -->
    <div class="lado">

      <header class="topbar topbar-rep">
        <div class="buscador-rep">
          <label class="buscador" for="buscarGlobal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="buscarGlobal" placeholder="Buscar en Reportes…" autocomplete="off" aria-controls="resultadosBusqueda" aria-label="Buscar en Reportes">
          </label>
          <div class="resultados-busqueda" id="resultadosBusqueda" role="listbox" hidden></div>
        </div>
        <div class="cuenta">
          <span class="divisor"></span>
          <svg class="avatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="9.2" />
            <circle cx="12" cy="10" r="3" />
            <path d="M6.2 19a6 6 0 0 1 11.6 0" />
          </svg>
          <div class="quien">
            <strong id="nombreUsuario">Jonathan</strong>
            <small id="rolUsuario">Administrador</small>
          </div>
          <button class="chevron" id="btnCuenta" aria-expanded="false" aria-controls="menuCuenta"
            aria-label="Abrir menú de la cuenta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M5 9l7 7 7-7" />
            </svg>
          </button>

          <div class="menu-cuenta" id="menuCuenta" role="menu">
            <button role="menuitem" data-ir="inicio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" />
                <path d="M9.5 21v-6h5v6" />
              </svg>
              Inicio
            </button>
            <button role="menuitem" data-ir="cuenta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="8.5" r="3.6" />
                <path d="M4.8 20c.9-3.7 3.8-5.7 7.2-5.7s6.3 2 7.2 5.7" />
              </svg>
              Cuenta
            </button>
            <button role="menuitem" data-ir="mantenimiento">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 3.5a4.5 4.5 0 0 0 5.9 5.9L21 9l-9.5 9.5a3 3 0 1 1-4.2-4.2L16 6l-1.5-2.5z" />
                <path d="M6.5 17.5h.01" />
              </svg>
              Soporte y Mantenimiento
            </button>
            <button role="menuitem" id="btnSalir">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                <path d="M10 8l4 4-4 4M14 12H3.5" />
              </svg>
              Salir
            </button>
          </div>
        </div>
      </header>

      <main class="contenido contenido-rep" id="contenidoRep">

        <div class="encabezado-rep">
          <div class="titulos-rep">
            <p class="migas" id="migasRep"></p>
            <h1 id="tituloRep">Centro de reportes</h1>
            <p class="sub" id="subRep">Consulta y descarga la información registrada en cada módulo</p>
          </div>

          <!-- Controles de los dashboards: período, actualizar, imprimir y exportar -->
          <div class="acciones-rep" id="accionesRep" hidden>
            <div class="selector-periodo" title="Período que se consulta">
              <button type="button" class="btn-periodo" id="btnPeriodo" aria-haspopup="true" aria-expanded="false" aria-label="Elegir período">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
                <span id="textoPeriodo">—</span>
                <svg class="flecha-periodo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
              </button>
              <select id="selPeriodo" aria-label="Período" hidden></select>
              <div class="popover-periodo" id="popoverPeriodo" hidden>
                <div class="anio-periodo">
                  <button type="button" id="anioAnterior" aria-label="Año anterior">‹</button>
                  <b id="anioPeriodo">2026</b>
                  <button type="button" id="anioSiguiente" aria-label="Año siguiente">›</button>
                </div>
                <div class="meses-periodo" id="mesesPeriodo"></div>
              </div>
            </div>
            <button type="button" class="btn-icono" id="btnActualizar" title="Actualizar datos" aria-label="Actualizar datos">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            </button>
            <button type="button" class="btn-icono" id="btnImprimir" title="Imprimir o guardar como PDF" aria-label="Imprimir o guardar como PDF">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg>
            </button>
            <button type="button" class="btn-excel" id="btnExportar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 16.5h6M10 9.5h2"/></svg>
              <span id="textoExportar">Exportar excel</span>
            </button>
          </div>
        </div>

        <!-- Pestañas del módulo -->
        <div class="tabs-rep" role="tablist" id="tabsRep">
          <button class="tab-rep is-on" role="tab" aria-selected="true" data-seccion="resumen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.4v9.2L12 21l-8-4.4V7.4z"/><path d="M4 7.4l8 4.5 8-4.5M12 12v9"/></svg>
            Resumen
          </button>
          <button class="tab-rep" role="tab" aria-selected="false" data-seccion="empleados" data-acceso="Empleados">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
            Empleados
          </button>
          <button class="tab-rep" role="tab" aria-selected="false" data-seccion="inventario" data-acceso="Inventario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a3.6 3.6 0 0 1-4.7 4.7L4.5 16.5a1.7 1.7 0 0 0 2.4 2.4L12.4 13a3.6 3.6 0 0 1 4.7-4.7l-2.4-2z"/><path d="M9.2 4.4L7.4 3l-2 .6-.6 2 1.4 1.8"/></svg>
            Inventario
          </button>
          <button class="tab-rep" role="tab" aria-selected="false" data-seccion="nominas" data-acceso="Nóminas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="13" height="18" rx="2"/><path d="M17 7h3v11a3 3 0 0 1-3 3"/><path d="M8 8h5M8 12h5M8 16h3" stroke-linecap="round"/></svg>
            Nóminas
          </button>
        </div>

        <p class="estado-actualizado" id="estadoActualizado" aria-live="polite"></p>

        <!-- Todas las vistas se dibujan dentro de este contenedor (ver js/reportes.js) -->
        <div class="vista-rep" id="vistaRep" aria-live="polite" aria-busy="false"></div>
      </main>
    </div>
  </div>

  <!-- ==================== MODAL: ALERTAS ==================== -->
  <div class="fondo-modal" id="modalAlertas" role="dialog" aria-modal="true" aria-labelledby="tituloAlertas">
    <div class="modal modal-alertas">
      <h3 id="tituloAlertas">Atención requerida</h3>
      <p class="nota" id="subAlertas" style="text-align:left;margin:0 0 14px"></p>
      <ul class="lista-alertas" id="listaAlertas"></ul>
      <div class="acciones-modal">
        <button class="btn-rojo" id="btnCerrarAlertas">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL: CONFIRMAR (genérico, de comun.js) ==================== -->
  <div class="fondo-modal" id="modalConfirmar" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmar">
    <div class="modal">
      <svg class="visto alerta" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <circle cx="60" cy="60" r="46" stroke="#E3453F" stroke-width="6" />
        <path d="M60 36v34" stroke="#E3453F" stroke-width="8" stroke-linecap="round" />
        <circle cx="60" cy="84" r="5" fill="#E3453F" />
      </svg>
      <h3 id="tituloConfirmar">¿Confirmar?</h3>
      <p id="textoConfirmar">Esta acción no se puede deshacer.</p>
      <div class="acciones-modal">
        <button class="btn-linea" id="btnNo">Cancelar</button>
        <button class="btn-rojo" id="btnSi">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>
  <script src="js/comun.js"></script>
  <script src="js/graficas.js"></script>
  <script src="js/reportes.js"></script>
</body>

</html>
